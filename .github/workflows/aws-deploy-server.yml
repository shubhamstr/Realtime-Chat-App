name: Build and Deploy Server to AWS ECR and EC2

on:
  # Manual deployment only - push automation can be uncommented when ready
  # push:
  #   branches: [ "main" ]
  #   paths:
  #     - 'server/**'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Server Image to ECR
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate server .env file
        run: |
          echo "PORT=5000" > ./server/.env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY || 'socket_secret_chat' }}" >> ./server/.env
          echo "CLIENT_URL=${{ vars.REACT_APP_CLIENT_URL }}" >> ./server/.env
          echo "SERVER_URL=${{ vars.REACT_APP_API_URL }}" >> ./server/.env
          echo "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" >> ./server/.env
          echo "MONGO_URI=${{ vars.MONGO_URI }}" >> ./server/.env
          echo "Server environment configured."

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_SERVER || 'chat-server' }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_SERVER || 'chat-server' }}:${{ github.sha }}

  deploy:
    name: Deploy Server to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Authenticate Docker to Amazon ECR on EC2
            aws ecr get-login-password --region ${{ vars.AWS_REGION || 'us-east-1' }} | docker login --username AWS --password-stdin ${{ needs.build-and-push.outputs.registry }}
            
            # Pull the latest image
            docker pull ${{ needs.build-and-push.outputs.registry }}/${{ vars.ECR_REPOSITORY_SERVER || 'chat-server' }}:latest
            
            # Restart container
            docker rm -f chat-server || true
            docker run -d --name chat-server -p 3001:5000 ${{ needs.build-and-push.outputs.registry }}/${{ vars.ECR_REPOSITORY_SERVER || 'chat-server' }}:latest
            
            # Verify container status
            sleep 3
            docker ps --filter "name=chat-server"
