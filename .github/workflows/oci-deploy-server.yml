name: Build and Deploy Server to Oracle Cloud

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/**'
  workflow_dispatch:

env:
  # E.g., iad.ocir.io for Ashburn, phx.ocir.io for Phoenix
  OCI_REGION_REGISTRY: "bom.ocir.io"
  OCI_NAMESPACE: "bm9iljpbnagj"
  OCI_USERNAME: "shubhamsutar5799@gmail.com"

jobs:
  build-and-push:
    name: Build and Push Server Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGION_REGISTRY }}
          username: ${{ env.OCI_NAMESPACE }}/${{ env.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Generate server .env file
        run: |
          echo "PORT=5000" > ./server/.env
          echo "JWT_SECRET_KEY=socket_secret_chat" >> ./server/.env
          echo "DB_PROVIDER=${{ vars.DB_PROVIDER }}" >> ./server/.env
          echo "CLIENT_URL=${{ vars.REACT_APP_CLIENT_URL }}" >> ./server/.env
          echo "SERVER_URL=${{ vars.REACT_APP_API_URL }}" >> ./server/.env
          echo "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" >> ./server/.env
          echo "DB_HOST=${{ vars.DB_HOST }}" >> ./server/.env
          echo "DB_PORT=${{ vars.DB_PORT }}" >> ./server/.env
          echo "DB_USER=${{ vars.DB_USER }}" >> ./server/.env
          echo "DB_PASS=${{ vars.DB_PASS }}" >> ./server/.env
          echo "DB_NAME=${{ vars.DB_NAME }}" >> ./server/.env
          echo "MONGO_URI=${{ vars.MONGO_URI }}" >> ./server/.env
          echo "--- server/.env contents ---"
          cat ./server/.env

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.OCI_REGION_REGISTRY }}/${{ env.OCI_NAMESPACE }}/chat-server:latest

  deploy:
    name: Deploy Server to Oracle Cloud VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USERNAME }} # Usually 'opc' or 'ubuntu'
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          script: |
            # Login to Oracle Registry on the VM
            echo '${{ secrets.OCI_AUTH_TOKEN }}' | docker login ${{ env.OCI_REGION_REGISTRY }} -u '${{ env.OCI_NAMESPACE }}/${{ env.OCI_USERNAME }}' --password-stdin
            
            # Pull the latest image
            docker pull ${{ env.OCI_REGION_REGISTRY }}/${{ env.OCI_NAMESPACE }}/chat-server:latest
            
            # Restart container
            docker rm -f chat-server || true
            docker run -d --name chat-server -p 3001:5000 ${{ env.OCI_REGION_REGISTRY }}/${{ env.OCI_NAMESPACE }}/chat-server:latest
            
            # Debug: Output logs and cat .env files inside the running container
            sleep 3
            docker logs chat-server
            docker exec chat-server cat .env || true