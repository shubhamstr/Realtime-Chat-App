name: Build and Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # E.g., iad.ocir.io for Ashburn, phx.ocir.io for Phoenix
  OCI_REGION_REGISTRY: "bom.ocir.io"
  OCI_NAMESPACE: "bm9iljpbnagj"
  OCI_USERNAME: "shubhamsutar5799@gmail.com"

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGION_REGISTRY }}
          username: ${{ env.OCI_NAMESPACE }}/${{ env.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.OCI_REGION_REGISTRY }}/${{ env.OCI_NAMESPACE }}/chat-server:latest

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.OCI_REGION_REGISTRY }}/${{ env.OCI_NAMESPACE }}/chat-client:latest
          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}
            REACT_APP_SOCKET_URL=${{ vars.REACT_APP_SOCKET_URL }}

  deploy:
    name: Deploy to Oracle Cloud VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PROVIDER: ${{ vars.DB_PROVIDER }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ vars.DB_PASS }}
          DB_NAME: ${{ vars.DB_NAME }}
          MONGO_URI: ${{ vars.MONGO_URI }}
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USERNAME }} # Usually 'opc' or 'ubuntu'
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          envs: DB_PROVIDER,DB_HOST,DB_PORT,DB_USER,DB_PASS,DB_NAME,MONGO_URI
          script: |
            # Login to Oracle Registry on the VM
            echo '${{ secrets.OCI_AUTH_TOKEN }}' | docker login ${{ env.OCI_REGION_REGISTRY }} -u '${{ env.OCI_NAMESPACE }}/${{ env.OCI_USERNAME }}' --password-stdin
            
            # Pull the latest images
            docker pull ${{ env.OCI_REGION_REGISTRY }}/${{ env.OCI_NAMESPACE }}/chat-server:latest
            docker pull ${{ env.OCI_REGION_REGISTRY }}/${{ env.OCI_NAMESPACE }}/chat-client:latest
            
            # Restart containers
            docker rm -f chat-server chat-client || true
            
            docker run -d --name chat-server -p 3001:5000 \
              -e PORT=5000 -e JWT_SECRET_KEY=socket_secret_chat \
              -e DB_PROVIDER="$DB_PROVIDER" -e DB_HOST="$DB_HOST" \
              -e DB_PORT="$DB_PORT" -e DB_USER="$DB_USER" \
              -e DB_PASS="$DB_PASS" -e DB_NAME="$DB_NAME" -e MONGO_URI="$MONGO_URI" \
              ${{ env.OCI_REGION_REGISTRY }}/${{ env.OCI_NAMESPACE }}/chat-server:latest
              
            docker run -d --name chat-client -p 3000:80 ${{ env.OCI_REGION_REGISTRY }}/${{ env.OCI_NAMESPACE }}/chat-client:latest