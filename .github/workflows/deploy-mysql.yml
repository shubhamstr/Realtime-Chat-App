name: Deploy MySQL Database (One-Time)

on:
  workflow_dispatch:

jobs:
  deploy-mysql:
    name: Deploy MySQL to Oracle Cloud VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy SQL schema to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USERNAME }}
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          source: "server/db/socket_chat.sql"
          target: "/home/${{ secrets.OCI_VM_USERNAME }}/"

      - name: Execute MySQL deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USERNAME }}
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          script: |
            docker network create chat-network || true
            docker rm -f chat-db || true
            
            docker run -d --name chat-db --network chat-network \
              -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
              -e MYSQL_DATABASE=socket_chat \
              -p 3306:3306 \
              mysql:8.0
              
            echo "Waiting 20 seconds for MySQL to initialize..."
            sleep 20
            
            echo "Importing schema..."
            docker exec -i chat-db mysql -uroot socket_chat < /home/${{ secrets.OCI_VM_USERNAME }}/server/db/socket_chat.sql